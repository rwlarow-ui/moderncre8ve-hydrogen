name: "SEO Truth Layer — Daily Pipeline"

on:
  schedule:
    - cron: "0 14 * * *"  # Every day at 2pm UTC (9am CT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seo-truth-layer

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account file
        run: echo '${{ secrets.GOOGLE_SA_JSON }}' > service_account.json

      - name: Run SEO Truth Layer pipeline
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SA_PATH: service_account.json
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: python -m src.main

      - name: Email weekly brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python -m src.send_email rob@moderncre8ve.com

      - name: Commit snapshots back to repo
        working-directory: ${{ github.workspace }}
        # history.db + refreshed CSVs must persist for WoW deltas to work.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-truth-layer/data/ seo-truth-layer/reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): refresh snapshots $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No snapshot changes to commit."
          fi

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-reports
          path: |
            seo-truth-layer/data/
            seo-truth-layer/reports/
